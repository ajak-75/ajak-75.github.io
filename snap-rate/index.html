<!doctype html>
<html lang="ko" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapRate — 여행 가격표 스캔 · 환율 계산</title>
<meta name="description" content="여행지 가격표를 찍으면 숫자를 읽어 내 나라 돈으로 바로 바꿔 줍니다. 큰 키패드로 1초 수정, 한국 결제엔 택스프리까지. 설치 없이 브라우저에서, 16개 언어.">
<meta name="theme-color" content="#FBF7EE">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://open.er-api.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'">
<link rel="canonical" href="https://ajak-75.github.io/snap-rate/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Ajak Studio">
<meta property="og:title" content="SnapRate — 여행 가격표 스캔 · 환율 계산">
<meta property="og:description" content="가격표를 찍으면 숫자를 읽고, 내 나라 돈으로 바로 바꿔 줍니다.">
<meta property="og:url" content="https://ajak-75.github.io/snap-rate/">
<meta property="og:image" content="https://ajak-75.github.io/snap-rate/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SnapRate — 여행 가격표 스캔 · 환율 계산">
<meta name="twitter:description" content="가격표를 찍으면 숫자를 읽고, 내 나라 돈으로 바로 바꿔 줍니다.">
<meta name="twitter:image" content="https://ajak-75.github.io/snap-rate/icon-512.png">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12.4" cy="12.4" r="7.4" fill="#DE5F3A"/>
          <circle cx="19.6" cy="19.6" r="7.4" fill="#FBF7EE"/>
          <circle cx="19.6" cy="19.6" r="5.1" stroke="#211E19" stroke-width="2.3"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">SnapRate</span>
        <span class="brand-sub" data-i18n="brandSub">가격표 스캔 · 환율 계산</span>
      </span>
    </div>
    <label class="lang-wrap">
      <span class="sr-only" data-i18n="langLabel">언어</span>
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
      <svg class="lang-caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </label>
  </header>

  <main class="main">

    <!-- 통화 · 환율 -->
    <section class="card rates" aria-labelledby="ratesTitle">
      <h2 class="sr-only" id="ratesTitle" data-i18n="rateTitle">환율</h2>
      <div class="rate-row">
        <div class="cur">
          <span class="cur-role" data-i18n="homeRole">내 나라 돈</span>
          <button type="button" class="cur-btn" id="homeBtn" aria-haspopup="dialog">
            <span class="cur-flag" id="homeFlag" aria-hidden="true">🇰🇷</span>
            <span class="cur-code" id="homeCode">KRW</span>
            <svg class="cur-caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
        <button type="button" class="swap" id="swapBtn" aria-label="통화 바꾸기" data-i18n-aria="swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13M14 5l3.4 3L14 11M20 16H7M10 13l-3.4 3L10 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="cur">
          <span class="cur-role" data-i18n="localRole">여행지 돈</span>
          <button type="button" class="cur-btn" id="localBtn" aria-haspopup="dialog">
            <span class="cur-flag" id="localFlag" aria-hidden="true">🇯🇵</span>
            <span class="cur-code" id="localCode">JPY</span>
            <svg class="cur-caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
      </div>
      <div class="rate-meta">
        <p class="rate-line"><span id="rateText">1 JPY = 8.47 KRW</span><span class="dot" aria-hidden="true">·</span><span class="rate-sub" id="rateSub">—</span></p>
        <button type="button" class="rate-refresh" id="rateRefresh" aria-label="환율 새로고침" data-i18n-aria="rateRefresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </section>

    <!-- 계산기 -->
    <section class="card calc" aria-labelledby="calcTitle">
      <h2 class="sr-only" id="calcTitle" data-i18n="calcTitle">가격 계산</h2>

      <div class="seg" role="group" aria-label="입력 통화">
        <button type="button" class="seg-btn is-on" id="segLocal" data-side="local" aria-pressed="true">
          <span data-i18n="localTab">여행지 돈</span><b id="segLocalCode">JPY</b>
        </button>
        <button type="button" class="seg-btn" id="segHome" data-side="home" aria-pressed="false">
          <span data-i18n="homeTab">내 나라 돈</span><b id="segHomeCode">KRW</b>
        </button>
      </div>

      <div class="display">
        <p class="disp-main"><span class="disp-amt" id="amtMain">0</span><span class="disp-cur" id="curMain">JPY</span></p>
        <p class="disp-conv"><span class="approx" aria-hidden="true">≈</span> <span id="amtConv">₩0</span> <span class="conv-cur" id="curConv">KRW</span></p>
      </div>

      <div class="tax" id="taxRow" hidden>
        <button type="button" class="tax-toggle" id="taxBtn" aria-pressed="false">
          <span class="tax-mark" aria-hidden="true">%</span>
          <span class="tax-label" data-i18n="taxLabel">택스프리 환급 예상</span>
          <span class="tax-val" id="taxVal">—</span>
          <span class="switch" aria-hidden="true"><i></i></span>
        </button>
        <div class="tax-net" id="taxNet" hidden>
          <p class="net-line"><span data-i18n="taxNet">실구매가</span> <b id="netVal">—</b></p>
          <p class="tax-note" data-i18n="taxNote">부가세 10%가 포함된 가격에서 수수료를 뺀 대략의 범위예요. 매장·금액에 따라 달라집니다.</p>
        </div>
      </div>

      <div class="scan-row">
        <button type="button" class="btn btn-scan" id="scanBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
          <span data-i18n="scanBtn">가격표 스캔</span>
        </button>
        <button type="button" class="btn btn-photo" id="photoBtn" aria-label="사진에서 불러오기" data-i18n-aria="scanUpload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5" width="17.6" height="14" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="8.6" cy="10" r="1.5" fill="currentColor"/><path d="m4.6 17 4.6-4.4 3 2.6 3-3.2 4.2 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <div class="chips" id="chips" hidden></div>

      <div class="keypad" id="keypad">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-fn" data-key="del" aria-label="한 자 지우기" data-i18n-aria="keyDelete">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h9.5A1.5 1.5 0 0 1 20 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9L3.6 13a1.5 1.5 0 0 1 0-2L9 5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/><path d="m11.5 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
        </button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-fn" data-key="clr" aria-label="전체 지우기" data-i18n-aria="keyClear">C</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-dot" data-key=".">.</button>

        <button type="button" class="key key-zero" data-key="0">0</button>
        <button type="button" class="key key-00" data-key="00">00</button>
      </div>
    </section>

    <p class="foot-note" data-i18n="footerNote">환율은 참고용이에요. 카드 실제 청구액과 다를 수 있어요.</p>
    <p class="foot-brand">© 2026 <a href="../">Ajak Studio</a></p>
  </main>
</div>

<!-- 통화 고르기 -->
<div class="sheet" id="curSheet" hidden>
  <div class="backdrop" data-close="curSheet"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="curSheetTitle">
    <div class="panel-head">
      <h2 id="curSheetTitle" data-i18n="pickerTitle">통화 고르기</h2>
      <button type="button" class="icon-btn" id="curClose" aria-label="닫기" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <input id="curSearch" type="search" autocomplete="off" enterkeyhint="search" placeholder="통화 검색" data-i18n-ph="searchPlaceholder">
    </div>
    <ul class="cur-list" id="curList"></ul>
  </div>
</div>

<!-- 가격표 스캔 -->
<div class="sheet" id="scanSheet" hidden>
  <div class="backdrop" data-close="scanSheet"></div>
  <div class="panel panel-scan" role="dialog" aria-modal="true" aria-labelledby="scanSheetTitle">
    <div class="panel-head">
      <h2 id="scanSheetTitle" data-i18n="scanTitle">가격표 스캔</h2>
      <button type="button" class="icon-btn" id="scanClose" aria-label="닫기" data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="shot-wrap" id="shotWrap">
      <img id="shot" alt="">
      <div class="shot-loading" id="shotLoading">
        <span class="spin" aria-hidden="true"></span>
        <p id="scanStatus">…</p>
      </div>
    </div>
    <p class="scan-msg" id="scanMsg" data-i18n="scanTip">가격표의 숫자가 화면에 크게 보이게 찍어 주세요.</p>
    <div class="chips chips-scan" id="scanChips" hidden></div>
    <div class="scan-actions">
      <button type="button" class="btn btn-line" id="scanAgain" data-i18n="scanAgain">다시 찍기</button>
      <button type="button" class="btn btn-line" id="scanDone" data-i18n="close">닫기</button>
    </div>
  </div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="libInput" accept="image/*" hidden>

<script src="./i18n.js?v=4"></script>
<script src="./app.js?v=5"></script>
</body>
</html>
