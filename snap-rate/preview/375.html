<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SnapRate — 375px 미리보기 (검수용)</title>
<style>
  html,body{margin:0;background:#E9E3D6;font:12px/1.4 -apple-system,sans-serif;color:#555}
  .wrap{display:flex;gap:14px;padding:14px;align-items:flex-start}
  iframe{width:375px;height:812px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);display:block}
</style>
</head>
<body>
<div class="wrap"><iframe id="phone" src="../?lang=ko" title="SnapRate 375px"></iframe></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var f = document.getElementById('phone');
    if (q.get('h')) f.style.height = q.get('h') + 'px';
    if (q.get('src')) f.src = q.get('src');
  })();
</script>
</body>
</html>
