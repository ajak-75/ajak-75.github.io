<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUBBLE MERGE card 375px 검수</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #wrap { width: 375px; }
  iframe { display: block; width: 375px; height: 812px; border: 0; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="phone" src="./?lang=ko" title="Ajak Studio 375px"></iframe>
</div>
<script>
  var f = document.getElementById('phone');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var fit = function () {
        var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
        f.style.height = h + 'px';
        /* 캡처용: 스크롤 없이 긴 화면을 찍기 위해 등장 애니메이션만 미리 켜 둔다 */
        var cards = d.querySelectorAll('.reveal');
        for (var i = 0; i < cards.length; i++) cards[i].classList.add('is-in');
      };
      fit();
      setTimeout(fit, 1500);
      setTimeout(fit, 3500);
    } catch (e) {}
  });
</script>
</body>
</html>
