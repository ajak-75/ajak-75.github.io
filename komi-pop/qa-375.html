<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>KOMI &amp; MOMO POP — 375×812 검수</title>
<style>
  html,body{margin:0;background:#241d28;font-family:-apple-system,"Noto Sans KR",sans-serif;color:#fff}
  .wrap{display:flex;gap:20px;padding:20px}
  .dev{width:375px;height:812px;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#fff}
  iframe{width:375px;height:812px;border:0;display:block}
  .panel{width:320px;display:flex;flex-direction:column;gap:8px;padding-top:4px}
  .panel h1{font-size:14px;margin:0 0 4px}
  .panel button{padding:9px 12px;border-radius:8px;border:1px solid #6b5870;background:#3a2f3f;color:#fff;font-size:13px;font-family:inherit;text-align:left;cursor:pointer}
  .panel button:hover{background:#4a3d51}
  pre{font-size:10px;line-height:1.4;background:#1a141d;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;margin:0}
</style></head>
<body>
<div class="wrap">
  <div class="dev"><iframe id="f" src="./?qa=1&t=3" title="komi-pop 375"></iframe></div>
  <div class="panel">
    <h1>검수 패널 (임시 · 배포 후 삭제)</h1>
    <button id="b3">① 3개 연결 → 터뜨리기</button>
    <button id="b7">② 7개 연결 → 황금 폭탄</button>
    <button id="bBomb">③ 폭탄 탭 → 주변 폭발</button>
    <button id="bFever">④ 게이지 채우기 → 피버</button>
    <button id="bShuffle">⑤ 섞기</button>
    <button id="bEnd">⑥ 60초 종료 → 결과</button>
    <button id="bInfo">상태 새로고침</button>
    <pre id="out">ready</pre>
  </div>
</div>
<script>
  var f = document.getElementById('f');
  var out = document.getElementById('out');
  function qa() { return f.contentWindow.__KOMI_QA; }
  function show(extra) {
    var i = qa().info();
    out.textContent = (extra ? extra + '\n' : '') + JSON.stringify(i, null, 1);
  }
  function findChain(min) {
    var bs = qa().beads();
    var adj = bs.map(function (b, i) {
      var out = [];
      for (var j = 0; j < bs.length; j++) {
        if (i === j || bs[i].type !== bs[j].type) continue;
        if (Math.hypot(bs[j].x - b.x, bs[j].y - b.y) <= (b.r + bs[j].r) * 1.8) out.push(j);
      }
      return out;
    });
    function dfs(s) {
      var p = [s], seen = {}; seen[s] = 1;
      function go(v) {
        if (p.length >= min) return true;
        var nb = adj[v];
        for (var k = 0; k < nb.length; k++) {
          var u = nb[k];
          if (seen[u]) continue;
          seen[u] = 1; p.push(u);
          if (go(u)) return true;
          p.pop(); seen[u] = 0;
        }
        return false;
      }
      return go(s) ? p.slice() : null;
    }
    for (var i = 0; i < bs.length; i++) { var r = dfs(i); if (r) return r; }
    return null;
  }
  function dragChain(min) {
    var idx = findChain(min);
    if (!idx) { out.textContent = min + '개 연결을 찾지 못했어요 (판을 섞어 보세요)'; return; }
    var bs = qa().beads();
    var pts = idx.map(function (i) { return [bs[i].x, bs[i].y]; });
    var r = qa().drag(pts);
    show('drag: ' + JSON.stringify(r));
  }
  document.getElementById('b3').onclick = function () { dragChain(3); };
  document.getElementById('b7').onclick = function () { dragChain(7); };
  document.getElementById('bBomb').onclick = function () { show('tapBomb: ' + qa().tapBomb()); };
  document.getElementById('bFever').onclick = function () { qa().addFever(100); show('fever'); };
  document.getElementById('bShuffle').onclick = function () { qa().shuffle(); show('shuffle'); };
  document.getElementById('bEnd').onclick = function () { qa().tick(0.05); show('end'); };
  document.getElementById('bInfo').onclick = function () { show('info'); };
  setInterval(function () { if (qa()) show('auto'); }, 1500);
</script>
</body></html>
