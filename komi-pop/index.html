<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="KOMI &amp; MOMO POP — 한붓그리기 팡!">
<meta name="twitter:description" content="같은 구슬을 3개 이상 한붓으로 이어 터뜨리는 60초 라인 링크 퍼즐.">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css?v=9">
</head>
<body>
<div class="app">

  <header class="top">
    <h1 class="brand">
      <span class="brand-paw" aria-hidden="true">
        <svg viewBox="0 0 24 24"><ellipse cx="7" cy="9" rx="2.4" ry="3.1"/><ellipse cx="12" cy="6.6" rx="2.4" ry="3.2"/><ellipse cx="17" cy="9" rx="2.4" ry="3.1"/><path d="M12 11.2c3.4 0 6 2.4 6 5 0 2.1-1.7 3.4-4 3.4-1 0-1.4-.4-2-.4s-1 .4-2 .4c-2.3 0-4-1.3-4-3.4 0-2.6 2.6-5 6-5z"/></svg>
      </span>
      <span class="brand-name">KOMI<span class="amp">&amp;</span>MOMO</span>
      <span class="brand-pop">POP</span>
    </h1>

    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">
        <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="wave" d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path class="wave" d="M17.9 6.2a8 8 0 0 1 0 11.6"/></svg>
        <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <div class="lang" id="langWrap">
        <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu" aria-label="Language">
          <span class="lang-cur" id="langCur">한국어</span>
          <svg class="lang-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 4.6 6 8l3.4-3.4"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox" aria-label="Language" hidden></div>
      </div>
    </div>
  </header>

  <section class="hud" aria-live="off">
    <div class="hud-left">
      <div class="stat">
        <span class="stat-k" data-i18n="score">점수</span>
        <span class="stat-v" id="score">0</span>
      </div>
      <div class="stat stat-best">
        <span class="stat-k" data-i18n="best">최고</span>
        <span class="stat-v" id="best">0</span>
      </div>
      <div class="combo-chip" id="comboChip" hidden>
        <span class="combo-x">×</span><span id="comboVal">2</span>
        <span class="combo-k" data-i18n="combo">콤보</span>
      </div>
    </div>
    <div class="time-ring" id="timeRing" style="--p:100">
      <span class="time-num" id="timeLeft">60</span>
    </div>
  </section>

  <div class="fever-bar" id="feverBar">
    <span class="fever-k" data-i18n="fever">피버</span>
    <span class="fever-track"><span class="fever-fill" id="feverFill"></span></span>
  </div>

  <div class="stage" id="stageWrap">
    <canvas id="game" aria-label="한붓그리기 팡 게임판"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel" id="introPanel">
        <div class="bead-strip" aria-hidden="true">
          <img src="./chars/bead-0.webp" alt="" width="38" height="38">
          <img src="./chars/bead-1.webp" alt="" width="38" height="38">
          <img src="./chars/bead-2.webp" alt="" width="38" height="38">
          <img src="./chars/bead-3.webp" alt="" width="38" height="38">
          <img src="./chars/bead-4.webp" alt="" width="38" height="38">
        </div>
        <h2 class="panel-title" data-i18n="startTitle">한붓그리기 팡!</h2>
        <p class="panel-desc" data-i18n="startDesc">같은 구슬을 3개 이상 한붓으로 이어 터뜨리는 60초 퍼즐이에요.</p>
        <ol class="how">
          <li><b>1</b><span data-i18n="how1">같은 구슬 3개 이상을 손가락으로 죽 이어요</span></li>
          <li><b>2</b><span data-i18n="how2">손을 떼면 팡! 점수와 콤보가 함께 올라요</span></li>
          <li><b>3</b><span data-i18n="how3">7개 이상 이으면 황금 폭탄이 생겨요</span></li>
        </ol>
        <button class="play-btn" id="startBtn" type="button" data-i18n="startBtn">시작하기</button>
        <p class="best-line"><span data-i18n="best">최고</span> <b id="bestIntro">0</b></p>
        <a class="studio-link" href="https://ajak-75.github.io/" target="_blank" rel="noopener">Ajak Studio</a>
      </div>

      <div class="panel" id="overPanel" hidden>
        <p class="panel-eyebrow" data-i18n="overTitle">시간 종료</p>
        <p class="final-score" id="finalScore">0</p>
        <p class="record" id="recordLine" hidden data-i18n="newRecord">신기록!</p>
        <p class="panel-desc" data-i18n="overDesc">60초 동안 모은 점수예요</p>
        <div class="over-stats">
          <div><span data-i18n="maxCombo">최대 콤보</span><b id="stCombo">×1</b></div>
          <div><span data-i18n="longest">최장 연결</span><b id="stChain">0</b></div>
          <div><span data-i18n="popped">터뜨린 구슬</span><b id="stPopped">0</b></div>
        </div>
        <button class="play-btn" id="againBtn" type="button" data-i18n="playAgain">다시 하기</button>
        <a class="studio-link" href="https://ajak-75.github.io/" target="_blank" rel="noopener">Ajak Studio</a>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="shuffle-btn" id="shuffleBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.2c1.3 0 2.2.5 3 1.6l3.6 4.8c.8 1.1 1.7 1.6 3 1.6H20"/><path d="M4 17h3.2c1.3 0 2.2-.5 3-1.6l1.4-1.9"/><path d="M13 9.4l1.8-1.8c.8-1.1 1.7-1.6 3-1.6H20"/><path d="M17.6 3.6 20 6l-2.4 2.4M17.6 13.6 20 16l-2.4 2.4"/></svg>
      <span data-i18n="shuffle">섞기</span>
    </button>
    <p class="dock-hint" data-i18n="hint">구슬을 눌러 한붓으로 이어 보세요</p>
  </div>

</div>

<script src="./i18n.js?v=5"></script>
<script src="./game.js?v=17"></script>
</body>
</html>
