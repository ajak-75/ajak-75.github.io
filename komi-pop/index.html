<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOMI &amp; MOMO POP — Ajak Studio</title>
<meta name="description" content="코미와 모모를 합쳐 대왕 골드 코미를 만드는 캐주얼 합치기 퍼즐. KOMI & MOMO POP — a cozy merge puzzle by Ajak Studio.">
<meta name="theme-color" content="#FFF4F9">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="canonical" href="https://ajak-75.github.io/komi-pop/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Ajak Studio">
<meta property="og:title" content="KOMI &amp; MOMO POP">
<meta property="og:description" content="코미와 모모를 합쳐 대왕 골드 코미를 만드는 캐주얼 합치기 퍼즐.">
<meta property="og:url" content="https://ajak-75.github.io/komi-pop/">
<meta property="og:image" content="https://ajak-75.github.io/komi-pop/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="KOMI &amp; MOMO POP">
<meta name="twitter:description" content="코미와 모모를 합쳐 대왕 골드 코미를 만드는 캐주얼 합치기 퍼즐.">
<meta name="twitter:image" content="https://ajak-75.github.io/komi-pop/icon-512.png">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
<div class="app">

  <header class="top">
    <h1 class="brand">
      <span class="brand-paw" aria-hidden="true">
        <svg viewBox="0 0 24 24"><ellipse cx="7" cy="9" rx="2.4" ry="3.1"/><ellipse cx="12" cy="6.6" rx="2.4" ry="3.2"/><ellipse cx="17" cy="9" rx="2.4" ry="3.1"/><path d="M12 11.2c3.4 0 6 2.4 6 5 0 2.1-1.7 3.4-4 3.4-1 0-1.4-.4-2-.4s-1 .4-2 .4c-2.3 0-4-1.3-4-3.4 0-2.6 2.6-5 6-5z"/></svg>
      </span>
      <span class="brand-name">KOMI<span class="amp">&amp;</span>MOMO</span>
      <span class="brand-pop">POP</span>
    </h1>

    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">
        <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="wave" d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path class="wave" d="M17.9 6.2a8 8 0 0 1 0 11.6"/></svg>
        <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <label class="lang">
        <span class="sr-only" data-i18n="lang">언어</span>
        <select id="langSel" aria-label="Language"></select>
        <svg class="lang-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 4.6 6 8l3.4-3.4"/></svg>
      </label>
    </div>
  </header>

  <section class="hud" aria-live="off">
    <div class="hud-scores">
      <div class="stat">
        <span class="stat-k" data-i18n="score">점수</span>
        <span class="stat-v" id="score">0</span>
      </div>
      <div class="stat stat-best">
        <span class="stat-k" data-i18n="best">최고</span>
        <span class="stat-v" id="best">0</span>
      </div>
    </div>
    <div class="next">
      <span class="next-k" data-i18n="next">다음</span>
      <canvas id="nextCv" width="88" height="88" aria-hidden="true"></canvas>
    </div>
  </section>

  <div class="stage" id="stageWrap">
    <canvas id="game" aria-label="KOMI &amp; MOMO POP 게임판"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel" id="introPanel">
        <canvas class="intro-art" id="introArt" width="240" height="180" aria-hidden="true"></canvas>
        <p class="panel-desc" data-i18n="startDesc">같은 친구끼리 만나면 한 단계 위로 변신해요.</p>
        <button class="play-btn" id="startBtn" type="button" data-i18n="startBtn">시작하기</button>
        <p class="panel-hint" data-i18n="hint">좌우로 움직여 떨어뜨리세요</p>
      </div>
      <div class="panel" id="overPanel" hidden>
        <p class="panel-eyebrow" data-i18n="overTitle">게임 끝</p>
        <p class="final-score" id="finalScore">0</p>
        <p class="record" id="recordLine" hidden data-i18n="newRecord">신기록!</p>
        <p class="panel-desc" data-i18n="overDesc">구슬이 위쪽 선을 넘었어요</p>
        <button class="play-btn" id="againBtn" type="button" data-i18n="playAgain">다시 하기</button>
      </div>
    </div>
  </div>

  <section class="evo" aria-label="Evolution">
    <span class="evo-k" data-i18n="evolution">진화</span>
    <div class="evo-track" id="evoTrack"></div>
  </section>

</div>

<script src="./i18n.js?v=2"></script>
<script src="./sprites.js?v=9"></script>
<script src="./game.js?v=4"></script>
</body>
</html>
