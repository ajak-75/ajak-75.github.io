<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>KOMI &amp; MOMO POP — maskable icon</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFB9D6; }
  #tile { width: 512px; height: 512px; display: block; }
</style>
</head>
<body>
<canvas id="tile" width="1024" height="1024"></canvas>
<script src="./sprites.js?v=9"></script>
<script>
(function () {
  var c = document.getElementById('tile');
  var g = c.getContext('2d');
  var S = 1024;
  var bg = g.createLinearGradient(0, 0, S, S);
  bg.addColorStop(0, '#FFE7F2');
  bg.addColorStop(0.45, '#FFB9D6');
  bg.addColorStop(1, '#FF7EB3');
  g.fillStyle = bg;
  g.fillRect(0, 0, S, S);
  var gl = g.createRadialGradient(S * 0.3, S * 0.2, 0, S * 0.3, S * 0.2, S * 0.7);
  gl.addColorStop(0, 'rgba(255,255,255,.75)');
  gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl;
  g.fillRect(0, 0, S, S);

  // 안전 영역(가운데 72%) 안에만 그림
  var inner = S * 0.72;
  var ox = (S - inner) / 2, oy = (S - inner) / 2;
  var gold = window.KOMI_POP_SPRITES.make(8, 620);
  var momo = window.KOMI_POP_SPRITES.make(2, 330);
  g.drawImage(gold, ox + inner * 0.14, oy + inner * 0.04, inner * 0.86, inner * 0.86);
  g.drawImage(momo, ox + inner * 0.0, oy + inner * 0.56, inner * 0.44, inner * 0.44);
})();
</script>
</body>
</html>
