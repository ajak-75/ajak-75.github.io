<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>KOMI &amp; MOMO POP — icon test</title>
<style>
  html,body { margin:0; background:#FFFFFF; display:grid; place-items:center; min-height:100vh; }
  #tile { width:512px; height:512px; display:block; }
  #tile2 { width:512px; height:512px; display:block; }
</style>
</head>
<body>
<canvas id="tile" width="1024" height="1024"></canvas>
<script src="./sprites.js"></script>
<script>
(function(){
  var c = document.getElementById('tile');
  var g = c.getContext('2d');
  var S = 1024;
  // 배경: 둥근 사각형 핑크 그라데이션
  function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  var bg = g.createLinearGradient(0,0,S,S);
  bg.addColorStop(0,'#FFE1EF'); bg.addColorStop(.55,'#FFB9D6'); bg.addColorStop(1,'#FF86B8');
  rr(0,0,S,S,232); g.fillStyle=bg; g.fill();
  // 반짝 배경 점
  g.globalAlpha=.5; g.fillStyle='#FFFFFF';
  [[190,180,26],[840,220,18],[210,840,20],[820,800,30],[512,120,12]].forEach(function(p){
    g.beginPath(); g.arc(p[0],p[1],p[2],0,Math.PI*2); g.fill();
  });
  g.globalAlpha=1;
  // 골드 코미 + 모모
  var momo = window.KOMI_POP_SPRITES.make(2, 420);
  var gold = window.KOMI_POP_SPRITES.make(8, 620);
  g.drawImage(momo, 96, 480, 420, 420);
  g.drawImage(gold, 330, 130, 620, 620);
})();
</script>
</body>
</html>
