<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>dev — sprites &amp; mobile frame</title>
<style>
  body { margin:0; background:#F4F6F8; font:12px/1.4 -apple-system, sans-serif; color:#333; }
  .sheet { display:grid; grid-template-columns:repeat(5, 200px); gap:10px; padding:14px; }
  .cell { background:#fff; border:1px solid #e5e7eb; border-radius:10px; text-align:center; padding:6px; }
  .cell canvas { width:190px; height:190px; display:block; }
  #frame { border:0; width:375px; height:812px; display:block; }
  .wrap { display:flex; gap:20px; padding:10px; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<div class="wrap">
  <iframe id="frame" src="./index.html?lang=ko"></iframe>
</div>
<script src="./sprites.js?v=10"></script>
<script>
(function(){
  var sheet = document.getElementById('sheet');
  for (var i = 0; i < 9; i++) {
    var d = document.createElement('div');
    d.className = 'cell';
    var c = document.createElement('canvas');
    c.width = 380; c.height = 380;
    var g = c.getContext('2d');
    g.drawImage(window.KOMI_POP_SPRITES.make(i, 380), 0, 0, 380, 380);
    d.appendChild(c);
    var p = document.createElement('div');
    p.textContent = 'STAGE ' + (i + 1);
    d.appendChild(p);
    sheet.appendChild(d);
  }
})();
</script>
</body>
</html>
